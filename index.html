<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Art For Centuries</title><style>
:root{--bg:#070706;--gold:#c9ad6a;--gold-soft:#9f854a;--text:#efe8dc;--muted:#9c9587;--line-soft:rgba(255,255,255,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 18%,rgba(201,173,106,.13),transparent 28%),radial-gradient(circle at 50% 82%,rgba(201,173,106,.08),transparent 34%),linear-gradient(90deg,rgba(201,173,106,.08),transparent 15%,transparent 85%,rgba(201,173,106,.08)),#070706}.stage{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 24px 42px}.stage:before,.stage:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(201,173,106,.72),transparent);opacity:.45}.stage:before{left:16%}.stage:after{right:16%}.arc{position:absolute;width:min(900px,86vw);height:min(900px,86vw);border:1px solid rgba(201,173,106,.14);border-radius:999px;top:26%;left:50%;transform:translateX(-50%);opacity:.65}.shell{width:min(920px,100%);text-align:center;z-index:1}.brand{margin:0 0 30px;color:var(--gold);font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,3vw,44px);font-weight:400;letter-spacing:clamp(.38em,1.1vw,.74em);text-transform:uppercase;text-shadow:0 0 26px rgba(201,173,106,.20)}.divider{width:46px;height:1px;background:var(--gold-soft);margin:0 auto 34px}.kicker{margin:0 0 86px;color:var(--muted);font-size:11px;letter-spacing:.58em;line-height:2;text-transform:uppercase}.access-card{width:min(560px,100%);margin:0 auto 44px;padding:clamp(34px,5vw,62px);border:1px solid var(--line-soft);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),rgba(0,0,0,.24);box-shadow:0 30px 90px rgba(0,0,0,.40),inset 0 0 60px rgba(255,255,255,.025);backdrop-filter:blur(14px)}.monogram{display:inline-flex;gap:16px;margin-bottom:48px;color:var(--gold);font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.30em}.monogram span{display:block;width:1px;height:44px;background:linear-gradient(to bottom,transparent,var(--gold),transparent)}.access-title{margin:0 0 34px;color:#aaa397;font-size:11px;letter-spacing:.52em;text-transform:uppercase;font-weight:400}.small-line{width:46px;height:1px;background:rgba(201,173,106,.45);margin:0 auto 42px}.field{margin-bottom:28px}label{display:block;margin-bottom:14px;text-align:left;color:#8f887d;font-size:10px;letter-spacing:.42em;text-transform:uppercase}input{width:100%;border:1px solid rgba(201,173,106,.18);border-bottom:1px solid rgba(201,173,106,.55);background:linear-gradient(180deg,rgba(201,173,106,.04),rgba(0,0,0,.18));color:var(--gold);outline:none;padding:14px 18px;font-size:15px;border-radius:8px;backdrop-filter:blur(12px);transition:.35s ease;caret-color:var(--gold);}input::placeholder{color:rgba(239,232,220,.28);letter-spacing:.18em;}input:focus{border-bottom:1px solid rgba(201,173,106,.9);box-shadow:0 10px 30px rgba(201,173,106,.05);}input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:#efe8dc;-webkit-box-shadow:0 0 0px 1000px #070706 inset;transition:background-color 9999s ease-in-out 0s;}.request{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid rgba(201,173,106,.46);background:transparent;color:#a7a093;cursor:pointer;padding:16px 0 18px;text-align:left;font-size:11px;letter-spacing:.52em;text-transform:uppercase;transition:.2s}.request:hover{color:var(--gold);border-color:var(--gold)}.sentence{margin:0 0 82px;color:#8f887d;font-size:10px;letter-spacing:.46em;text-transform:uppercase}footer{display:flex;justify-content:center;gap:clamp(38px,7vw,86px);color:#6f675a;font-size:10px;letter-spacing:.36em;text-transform:uppercase}footer a{color:inherit;text-decoration:none}
